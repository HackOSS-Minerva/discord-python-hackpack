[project]
name = "discord-python-hackpack"
version = "0.1.0"
description = "Discord Python Hackpack"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord-py>=2.7.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
bot = "bot.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bot"
namespace = true

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
