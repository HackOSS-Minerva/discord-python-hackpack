[project]
name = "bot"
version = "0.1.0"
description = "Discord Python Hackpack"
authors = []
requires-python = ">=3.14"
dependencies = [
    "discord-py (>=2.7.1,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[project.scripts]
bot = "bot.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "yapf (>=0.43.0,<0.44.0)",
    "pylint (>=4.1.3,<5.0.0)"
]

[tool.yapf]
based_on_style = "pep8"
column_limit = 100
