[project]
name = "bot"
version = "0.1.0"
description = "Discord Python Hackpack"
authors = []
requires-python = ">=3.14"
dependencies = [
    "discord-py (>=2.7.1,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[project.scripts]
bot = "bot.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
